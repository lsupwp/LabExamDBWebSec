# Host: {username}.grade.local  →  /var/www/data/submissions/{username}/www
UseCanonicalName Off

<VirtualHost *:80>
    ServerName grade.local
    ServerAlias *.grade.local
    VirtualDocumentRoot /var/www/data/submissions/%1/www

    <Directory /var/www/data>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/runner-error.log
    CustomLog ${APACHE_LOG_DIR}/runner-access.log combined
</VirtualHost>
